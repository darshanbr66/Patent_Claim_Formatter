<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers | Zodiac Patent</title>

<link rel="icon" href="zodiac-logo.jpg" type="image/png">
<link rel="shortcut icon" href="zodiac-logo.jpg">
<link rel="apple-touch-icon" href="zodiac-logo.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.card{
    width:100%;
    max-width:820px;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(15,23,42,.08);
}

.top-bar{
    height:8px;
    background:#1d4ed8;
}

.content{
    padding:70px 60px;
    text-align:center;
}

.logo{
    margin-bottom: 28px;
    display:flex;
    justify-content:center;
}

.logo img{
    width:100px;
    max-width:100%;
    height:auto;
}

h4{
    color:#2563eb;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:14px;
    margin-bottom:14px;
}

h1{
    font-size:42px;
    color:#0f172a;
    margin-bottom:22px;
    font-weight:700;
}

p{
    font-size:18px;
    color:#475569;
    line-height:1.8;
    max-width:620px;
    margin:0 auto;
}

.divider{
    width:80px;
    height:4px;
    background:#2563eb;
    margin:40px auto;
    border-radius:20px;
}

.status{
    display:inline-block;
    background:#eff6ff;
    color:#1d4ed8;
    padding:12px 26px;
    border-radius:999px;
    font-weight:600;
    font-size:15px;
}

footer{
    margin-top:55px;
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:768px){

    .content{
        padding:50px 30px;
    }

    h1{
        font-size:32px;
    }

    p{
        font-size:16px;
    }

}
</style>

</head>
<body>

<section class="hero">

<div class="card">

    <div class="top-bar"></div>

    <div class="content">

        <div class="logo">
            <img src="zodiac-logo.jpg" alt="Zodiac Patent">
        </div>

        <h1>Join Our Team</h1>

        <p>
            Thank you for your interest in joining Zodiac Patent.
            We are currently building our Careers Portal to provide
            a seamless experience for future applicants.
        </p>
        <div class="divider"></div>

        <div class="status">
            Launching Soon
        </div>

        <footer>
            We appreciate your patience and look forward to welcoming talented professionals in the near future.
        </footer>

    </div>

</div>

</section>

</body>
</html>
